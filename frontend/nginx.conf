server {
    listen 80;

    # Statische Frontend-Dateien ausliefern
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API-Anfragen an den Backend-Container weiterleiten
    location /api/ {
        proxy_pass http://backend:8080;
    }
}